<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h1 class="mb-4">Formulario de Registro</h1>

        <form action="registro.php" method="POST" class="p-4 bg-dark text-white rounded">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" required>
            </div>

            <div class="mb-3">
                <label for="edad" class="form-label">Edad</label>
                <input type="number" class="form-control" id="edad" name="edad" min="1" required>
            </div>

            <div class="mb-3">
                <label for="valoracion" class="form-label">Valoración (1 a 10)</label>
                <input type="number" class="form-control" id="valoracion" name="valoracion" min="1" max="10" required>
            </div>

            <div class="mb-3">
                <label for="comentario" class="form-label">Comentario</label>
                <textarea class="form-control" id="comentario" name="comentario" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-light btn-lg">Enviar</button>
	    <button type="reset" class="btn btn-light btn-lg">Borrar</button>
        </form>
    </div>
</body>
</html>
